<style>

  --red:#C21F32; --red-tint:#FBE3E5; --green:#1E7B3C; --green-tint:#E2F2E7;
  --sea:#2D7FB8; --sea-tint:#DCEEFA;
  --disp:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Avant Garde","Futura","Trebuchet MS",sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
body{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}
body.zA{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}
body.zB{--pc:#2D7FB8;--pc-ink:#ffffff;--pc-tint:#DCEEFA}
body.zC{--pc:#C21F32;--pc-ink:#ffffff;--pc-tint:#FBE3E5}
body.zD{--pc:#1E7B3C;--pc-ink:#ffffff;--pc-tint:#E2F2E7}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,label,.tile,.opt,.tick,.gi,.pbtn,.bb,.tb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{font-size:28px;height:100%;overflow:hidden}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-family:var(--body);color:var(--black);background:#fffdf8;line-height:1.3;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:4px solid var(--or);outline-offset:3px}
.disp{font-family:var(--disp);font-weight:700}

.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:6px;padding:6px 8px;flex:none}
.dots{display:flex;gap:5px;flex:none}
.dots i{display:block;width:11px;height:11px;border-radius:50%;background:var(--green)}
.dots i:first-child{background:var(--red)}
.dots i:nth-child(2){background:var(--or)}
.addr{flex:1;min-width:0;background:var(--addr);border-radius:999px;padding:4px 14px;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:#fff;color:#111;border:0;border-radius:5px;font-weight:700;font-size:20px;min-height:46px;min-width:46px;padding:0 10px;flex:none}
.tag{background:var(--or);color:#111;font-family:var(--disp);font-weight:700;font-size:17px;padding:3px 8px;flex:none}
.bunting{flex:none;height:18px;background:var(--bar);position:relative;overflow:hidden}
.bunting i{position:absolute;top:0;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:17px solid var(--red)}
.prog{height:12px;background:#fff;flex:none;display:flex;gap:2px;padding:3px 3px 0}
.prog i{display:block;flex:1;height:100%;opacity:.22}
.prog i.done{opacity:1}

.saved{position:fixed;right:10px;z-index:30;background:var(--green);color:#fff;font-weight:700;font-size:17px;padding:3px 10px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.saved.show{opacity:1}

main{flex:1;overscroll-behavior:contain;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:.5rem .7rem 1rem}
.wrap{max-width:1000px;margin:0 auto}

.foot{flex:none;border-top:6px solid var(--pc);background:#fff;padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bb{border:3px solid var(--black);background:#fff;font-weight:700;min-height:2.1em;padding:0 .8em;border-radius:8px;font-size:1em}
.foot .bb{font-size:21px;min-height:54px;padding:2px 10px;flex:1 1 0;min-width:0;line-height:1.15}
.bb.go{background:var(--or)}
.bb.green{background:var(--green);border-color:var(--green);color:#fff}
.bb.red{background:var(--red);border-color:var(--red);color:#fff}
.bb[disabled]{opacity:.35;cursor:default}

/* hero */
.bw{border:3px solid var(--black);border-bottom:10px solid var(--red);background:#fff;overflow:hidden;border-radius:10px;margin:.3em 0 .7em}
.bwbar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:.5em;padding:.3em .6em;font-size:.75em}
.bwaddr{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--or-tint);border-left:12px solid var(--or);padding:.7em .9em;margin:.7em;border-radius:0 10px 10px 0}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:.72em;color:var(--or-deep)}
.big{font-family:var(--disp);font-weight:700;font-size:1.6em;line-height:1.08;margin:.15em 0;overflow-wrap:break-word}
.sub{font-size:1em;margin:.2em 0}
.meter{margin:0 .7em .7em;border:3px solid var(--black);height:1.05em;background:#fff;position:relative;border-radius:999px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--red) 0 14px,#fff 14px 22px,var(--green) 22px 36px,#fff 36px 44px)}
.mtxt{margin:0 .7em .7em;font-weight:700}

.note{display:flex;background:var(--pale2);margin:.6em 0;border-radius:8px;overflow:hidden}
.note .badge{width:1.9em;flex:none;background:var(--green);color:#fff;display:flex;justify-content:center;padding-top:.35em;font-weight:700}
.note.info .badge{background:#555}
.note.warn .badge{background:var(--red)}
.note .nb{padding:.45em .8em;flex:1;min-width:0}
.note p{margin:.12em 0}
.hl{background:var(--or-tint);border-bottom:3px solid var(--or);padding:0 .2em;font-weight:700}
.muted{color:var(--mid)}
.small{font-size:.8em}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center}
.wc{border:2px solid var(--black);background:#fff;padding:.15em .75em;min-height:2em;border-radius:999px;font-weight:700;max-width:100%}

/* zones and tiles */
.zhead{display:flex;align-items:stretch;margin:.9em 0 .4em}
.zhead .blk{background:var(--zc);color:var(--zi);font-family:var(--disp);font-weight:700;min-width:1.9em;display:flex;align-items:center;justify-content:center;font-size:1.05em}
.zhead .ttl{flex:1;min-width:0;background:var(--zt);border:3px solid var(--black);border-left:0;padding:.25em .6em;font-family:var(--disp);font-weight:700}
.zhead .ttl small{display:block;font-family:var(--body);font-weight:400;font-size:.72em;color:var(--mid)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(13em,100%),1fr));gap:.45em}
.tile{border:3px solid var(--black);border-left:12px solid var(--zc);background:#fff;border-radius:10px;padding:.35em .6em;display:flex;align-items:center;gap:.5em;text-align:left;min-height:2.8em;width:100%}
.tile .em{font-size:1.35em;flex:none}
.tile .tt{flex:1;min-width:0;overflow-wrap:break-word}
.tile .tt b{display:block}
.tile .tt span{font-size:.75em;color:var(--mid)}
.tile .st{flex:none;font-weight:700}
.tile.done{background:var(--green-tint);border-color:var(--green);border-left-color:var(--green)}
.tile.part{background:var(--or-tint)}

/* task screen */
.sbar{display:flex;align-items:stretch;margin:.2em 0 .5em}
.sbar .blk{background:var(--pc);color:var(--pc-ink);font-family:var(--disp);font-weight:700;min-width:2.2em;display:flex;align-items:center;justify-content:center;padding:0 .3em}
.sbar .ttl{flex:1;min-width:0;background:var(--pc-tint);border:3px solid var(--black);border-left:0;padding:.3em .7em;font-family:var(--disp);font-weight:700;overflow-wrap:break-word}
.where{display:inline-block;background:var(--black);color:#fff;border-radius:999px;padding:.05em .7em;font-size:.8em;font-weight:700;margin-bottom:.3em}
.steps{margin:.3em 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.5em;margin:.3em 0;align-items:flex-start}
.steps li:before{content:counter(s);flex:none;background:var(--black);color:#fff;font-weight:700;min-width:1.5em;height:1.5em;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85em}
.ask{display:flex;align-items:center;gap:.6em;border:3px solid var(--black);border-radius:16px 16px 16px 4px;background:var(--pc-tint);padding:.4em .8em;width:100%;text-align:left;margin:.5em 0}
.ask .who{flex:none;font-size:.75em;font-weight:700;background:var(--black);color:#fff;border-radius:999px;padding:.05em .6em}
.ask .sp{margin-left:auto;flex:none}
.ask{flex-wrap:wrap}
.ask>span.q2{flex:1 1 8em}
.box{border:3px solid var(--black);border-radius:12px;background:#fff;padding:.6em .8em;margin:.6em 0;border-bottom:8px solid var(--pc)}
.box h3{font-family:var(--disp);margin:.05em 0 .35em;font-size:1em}
.box.ok{border-color:var(--green);border-bottom-color:var(--green);background:var(--green-tint)}
.pbtns{display:flex;flex-wrap:wrap;gap:.45em}
.pbtn{position:relative;display:inline-flex;align-items:center;gap:.4em;border:3px solid var(--black);border-radius:10px;background:var(--or);font-weight:700;min-height:2.3em;padding:0 .8em;cursor:pointer;overflow:hidden}
.pbtn.alt{background:#fff}
.pbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.shot{display:block;max-width:100%;max-height:55vh;border:3px solid var(--black);border-radius:10px;margin:.4em 0}
.opt{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;border:3px solid var(--black);background:#fff;min-height:2.3em;padding:.3em .7em;margin:.35em 0;border-radius:10px}
.opt .lt{flex:none;background:var(--black);color:#fff;font-weight:700;border-radius:6px;min-width:1.4em;text-align:center}
.opt .mk{margin-left:auto;font-weight:700;flex:none}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.right .lt{background:#fff;color:var(--green)}
.opt.wrong{background:repeating-linear-gradient(45deg,#f1d6d9 0 8px,#e8c3c7 8px 16px)}
.opt.wrong .tx{text-decoration:line-through}
.opt .tx,.steps li,.ask>span,.mail .mb p,.tick .tx{min-width:0;overflow-wrap:anywhere}
.why{border-left:10px solid var(--green);background:var(--green-tint);padding:.35em .7em;border-radius:0 8px 8px 0;margin:.4em 0}
.tick{border:3px solid var(--black);background:#fff;border-radius:10px;padding:.35em .6em;display:flex;align-items:center;gap:.5em;text-align:left;width:100%;min-height:2.3em;margin:.3em 0}
.tick .tx{flex:1;min-width:0;overflow-wrap:break-word}
.tick .bx{flex:none;width:1.25em;height:1.25em;border:3px solid var(--black);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tick.on{background:var(--green-tint);border-color:var(--green)}
.tick.on .bx{background:var(--green);border-color:var(--green);color:#fff}
.mail{border:3px solid var(--black);border-radius:10px;overflow:hidden;background:#fff;margin:.5em 0}
.mail .mh{background:var(--pale);padding:.25em .7em;border-bottom:2px solid #bbb;font-size:.9em}
.mail .mh b{display:inline-block;min-width:4.2em}
.mail .mb{padding:.5em .7em}
.mail .mb p{margin:.25em 0}
.att{display:inline-block;border:2px solid #888;border-radius:8px;padding:.05em .5em;font-size:.85em;background:var(--pale2)}
.donebar{display:flex;align-items:center;gap:.5em;background:var(--green);color:#fff;border-radius:10px;padding:.5em .8em;font-weight:700;margin:.6em 0}

/* gallery and teacher view */
.shrow{position:sticky;top:-.5rem;z-index:5;background:#fffdf8;padding:.3em 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(6.5em,46%),1fr));gap:.4em}
.gi{position:relative;border:4px solid var(--black);border-radius:10px;overflow:hidden;background:#fff;padding:0;text-align:left}
.gi img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.gi .cap{display:block;font-size:.65em;font-weight:700;padding:.15em .35em;overflow-wrap:break-word}
.gi .sel{position:absolute;top:.2em;right:.2em;background:#fff;border:3px solid var(--black);border-radius:6px;width:1.3em;height:1.3em;display:flex;align-items:center;justify-content:center;font-weight:700}
.gi.on{border-color:var(--green)}
.gi.on .sel{background:var(--green);border-color:var(--green);color:#fff}
.tv{width:100%;border-collapse:collapse;background:#fff;border:3px solid var(--black)}
.tv td,.tv th{border-top:2px solid #ccc;padding:.25em .4em;vertical-align:middle;text-align:left}
.tv th{background:var(--black);color:#fff;text-align:center}
.tv{font-size:.85em}
.tv img{width:2.6em;height:2.6em;object-fit:cover;border-radius:6px;border:2px solid var(--black);display:block}
.tv .c{text-align:center}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:.6rem}
.ovp{background:#fff;border:3px solid var(--black);border-radius:12px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:.6rem}
.ovp img{max-width:100%;display:block;margin:0 auto;border-radius:8px}

.burst{position:fixed;left:50%;top:50%;z-index:60;font-size:2rem;pointer-events:none;transition:transform 1.1s ease-out,opacity 1.1s ease-out}
@media (max-width:640px){
  .addr,.tag,.dots{display:none}
  .top{justify-content:flex-end;flex-wrap:wrap}
  .ttlbar{margin-right:auto}
  .big{font-size:1.3em}
  .panel{margin:.5em;padding:.55em .65em;border-left-width:8px}
  .meter,.mtxt{margin-left:.5em;margin-right:.5em}
  main{padding:.4rem .45rem 1rem}
  .zhead .blk,.sbar .blk{min-width:1.6em}
}
.ttlbar{flex:none;font-family:var(--disp);font-weight:700;font-size:17px;padding:4px 10px;border:2px solid #fff;border-radius:999px;background:var(--pc);color:var(--pc-ink);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* photos in IndexedDB */
function dbOpen(cb0){
  var called = false; function cb(){ if(called) return; called = true; cb0(); }
  try{
    var r = indexedDB.open(DBNAME, 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("p"); };
    r.onsuccess = function(){ DB = r.result; dbOK = true;
      try{
        var tx = DB.transaction("p", "readonly"), st = tx.objectStore("p"), cur = st.openCursor();
        cur.onsuccess = function(e){ var c = e.target.result; if(c){ PHOTOS[c.key] = c.value; c["continue"](); } else cb(); };
        cur.onerror = function(){ cb(); };
      }catch(e){ cb(); }
    };
    r.onerror = function(){ cb(); };
    r.onblocked = function(){ cb(); };
  }catch(e){ cb(); }
}
var putFail = false;
function dbPut(id, val){
  if(!dbOK){ putFail = true; return; }
  try{ var tx = DB.transaction("p", "readwrite"); tx.objectStore("p").put(val, id);
    tx.onerror = tx.onabort = function(){ putFail = true; keepScroll(); };
  }catch(e){ putFail = true; }
}
function dbDel(id){ if(!dbOK) return; try{ DB.transaction("p", "readwrite").objectStore("p")["delete"](id); }catch(e){} }
function dbClear(){ if(!dbOK) return; try{ DB.transaction("p", "readwrite").objectStore("p").clear(); }catch(e){} }

function compress(file, cb){
  var done = false;
  function viaReader(){ try{ var fr = new FileReader(); fr.onload = function(){ cb(fr.result); }; fr.onerror = function(){ cb(null); }; fr.readAsDataURL(file); }catch(e){ cb(null); } }
  try{
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      if(done) return; done = true;
      try{
        var max = 1100, w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(1, max / Math.max(w, hh));
        var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(hh * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var d = c.toDataURL("image/jpeg", 0.72); URL.revokeObjectURL(url); cb(d);
      }catch(e){ viaReader(); }
    };
    img.onerror = function(){ if(done) return; done = true; try{ URL.revokeObjectURL(url); }catch(e){} cb(null); };
    img.src = url;
  }catch(e){ viaReader(); }
}
function toFile(d, name){
  var arr = d.split(","), mime = (arr[0].match(/:(.*?);/) || [0, "image/jpeg"])[1], bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
  while(n--) u8[n] = bstr.charCodeAt(n);
  return new File([u8], name, {type:mime});
}

var VOICE = null;
function pickVoice(){ if(!window.speechSynthesis) return; var vs = speechSynthesis.getVoices(), pref = ["en-AU", "en-GB", "en-NZ", "en-US", "en"];
  for(var p = 0; p < pref.length; p++){ for(var i = 0; i < vs.length; i++){ if(vs[i].lang && vs[i].lang.replace("_", "-").indexOf(pref[p]) === 0){ VOICE = vs[i]; return; } } } }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){ if(!window.speechSynthesis) return; try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); if(VOICE) u.voice = VOICE; u.lang = VOICE ? VOICE.lang : "en-AU"; u.rate = 0.85; speechSynthesis.speak(u); }catch(e){} }

function burst(list){
  if(REDUCED) return;
  list = list || ["🎄", "⭐", "🎁", "🎅", "📸"];
  for(var i = 0; i < 18; i++){ (function(i){
    var s = h("span", {cls:"burst"}, list[i % list.length]); document.body.appendChild(s);
    var a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 200;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ s.style.transform = "translate(" + Math.round(Math.cos(a) * d) + "px," + Math.round(Math.sin(a) * d - 50) + "px)"; s.style.opacity = "0"; }); });
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1300);
  })(i); }
}

/* no zoom on double tap or pinch (older iPhones ignore the viewport rule) */
(function(){
  var last = 0, lastEl = null;
  document.addEventListener("touchend", function(e){
    var now = Date.now(), t = e.target;
    var el = t.closest ? (t.closest("button,a,label,input") || t) : t;
    if(now - last < 400 && e.touches.length === 0 && !(t.closest && t.closest("input,label"))){
      if(el === lastEl || !(t.closest && t.closest("button,a"))){ e.preventDefault(); }
    }
    last = now; lastEl = el;
  }, {passive:false});
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, {passive:false});
  /* a fast double tap on the same button only counts once */
  var cLast = 0, cX = -999, cY = -999;
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if(!b) return;
    var now = Date.now(), x = e.clientX, y = e.clientY;
    if(now - cLast < 450 && Math.abs(x - cX) < 40 && Math.abs(y - cY) < 40){ e.stopPropagation(); e.preventDefault(); return; }
    cLast = now; cX = x; cY = y;
  }, true);
})();

function taskById(id){ for(var i = 0; i < TASKS.length; i++) if(TASKS[i].id === id) return TASKS[i]; return null; }
function idx(id){ for(var i = 0; i < TASKS.length; i++) if(TASKS[i].id === id) return i; return -1; }
function qOK(t){ return !t.q || S.pick[t.id] === t.q.a; }
function checksOK(t){ if(!t.checks) return true; var tk = S.ticks[t.id] || {}; for(var i = 0; i < t.checks.length; i++) if(!tk[i]) return false; return true; }
function isDone(t){ return (!t.photo || !!PHOTOS[t.id]) && qOK(t) && checksOK(t); }
function isStarted(t){ return !!PHOTOS[t.id] || S.pick[t.id] != null || (S.ticks[t.id] && countKeys(S.ticks[t.id]) > 0); }
function countKeys(o){ var n = 0; for(var k in o) if(o.hasOwnProperty(k) && o[k]) n++; return n; }
function counts(){
  var main = 0, mainDone = 0, all = 0, done = 0, firstRight = 0, qs = 0, photos = 0;
  for(var i = 0; i < TASKS.length; i++){ var t = TASKS[i]; all++; if(isDone(t)) done++;
    if(!t.bonus){ main++; if(isDone(t)) mainDone++; }
    if(t.q){ qs++; if(S.first[t.id] === 1) firstRight++; }
    if(PHOTOS[t.id]) photos++; }
  return {main:main, mainDone:mainDone, all:all, done:done, firstRight:firstRight, qs:qs, photos:photos};
}

function bigPhoto(t){
  var root = document.getElementById("ovRoot");
  var ov = h("div", {cls:"ov", onclick:function(){ root.innerHTML = ""; }}, h("div", {cls:"ovp"}, [
    h("div", {cls:"row", style:"margin-bottom:.4em"}, [h("b", {style:"flex:1"}, t.id + " " + t.title), h("button", {cls:"bb"}, "✕ Close")]),
    h("img", {src:PHOTOS[t.id], alt:t.title})
  ]));
  root.innerHTML = ""; root.appendChild(ov);
}

/* ---------- frame ---------- */
function keepScroll(){ var m = document.getElementById("main"), y = m.scrollTop; render(); m.scrollTop = y; }
function openTask(id){ S.view = "task"; S.cur = id; save(); render(); document.getElementById("main").scrollTop = 0; }
function go(v){ if(v !== "photos") S.from = null; S.view = v; save(); render(); document.getElementById("main").scrollTop = 0; }

function setFoot(){
  var f = document.getElementById("foot"); f.innerHTML = "";
  if(S.view === "home"){
    f.appendChild(h("button", {cls:"bb", onclick:function(){ go("photos"); }}, "🖼️ My photos"));
    f.appendChild(h("button", {cls:"bb go", onclick:function(){ go("teacher"); }}, "👩‍🏫 Show my teacher"));
  } else if(S.view === "task"){
    var i = idx(S.cur);
    f.appendChild(h("button", {cls:"bb", onclick:function(){ go("home"); }}, "☰ All tasks"));
    var nxt = i < TASKS.length - 1 ? TASKS[i + 1] : null;
    f.appendChild(h("button", {cls:"bb " + (isDone(TASKS[i]) ? "green" : "go"), onclick:function(){ if(nxt) openTask(nxt.id); else go("teacher"); }}, nxt ? "Next: " + nxt.id + " ▶" : "Finish ▶"));
  } else {
    f.appendChild(h("button", {cls:"bb", onclick:function(){ if(S.view === "photos" && S.from){ var b = S.from; S.from = null; openTask(b); } else go("home"); }}, S.view === "photos" && S.from ? "◀ Back" : "☰ All tasks"));
  }
}
function render(){
  var z = S.view === "task" ? taskById(S.cur).z : (S.view === "teacher" ? "D" : "A");
  document.body.className = "z" + z;
  document.getElementById("ttlbar").textContent = S.view === "task" ? ZONES[z].name : (S.view === "photos" ? "My photos" : (S.view === "teacher" ? "My results" : "Search and Snap"));
  var prog = document.getElementById("prog"); prog.innerHTML = "";
  for(var i = 0; i < TASKS.length; i++){ var b = document.createElement("i"); b.style.background = ZONES[TASKS[i].z].col; if(isDone(TASKS[i])) b.className = "done"; prog.appendChild(b); }
  var w = document.getElementById("wrap"); w.innerHTML = "";
  w.appendChild(S.view === "task" ? vTask() : S.view === "photos" ? vPhotos() : S.view === "teacher" ? vTeacher() : vHome());
  setFoot();
}
function applySize(){ document.documentElement.style.fontSize = SIZES[S.size] + "px"; setTimeout(placeSaved, 30); }
function bunting(){ var b = document.getElementById("bunting"); b.innerHTML = ""; var cols = ["#C21F32", "#1E7B3C"], n = Math.ceil(window.innerWidth / 25) + 2;
  for(var i = 0; i < n; i++){ var t = document.createElement("i"); t.style.left = (i * 25) + "px"; t.style.borderTopColor = cols[i % 2]; b.appendChild(t); } }

document.getElementById("bHome").addEventListener("click", function(){ go("home"); });
document.getElementById("bSmall").addEventListener("click", function(){ if(S.size > 0){ S.size--; applySize(); save(); } });
document.getElementById("bBig").addEventListener("click", function(){ if(S.size < SIZES.length - 1){ S.size++; applySize(); save(); } });
var de = document.documentElement, bFull = document.getElementById("bFull");
if(!(de.requestFullscreen || de.webkitRequestFullscreen)) bFull.style.display = "none";
bFull.addEventListener("click", function(){ try{ if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { (de.requestFullscreen || de.webkitRequestFullscreen).call(de); } }catch(e){} });
window.addEventListener("resize", function(){ bunting(); placeSaved(); });

load();
if(S.view === "task" && !taskById(S.cur)) S.view = "home";
applySize(); bunting();
var started = false;
function start(){ if(started) return; started = true; render(); }
if(window.indexedDB){ dbOpen(start); setTimeout(start, 2500); } else { start(); }
})();
</script>
</body>
</html>
